name: Build & Release Windows Portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Download & Tidy Dependencies
        shell: pwsh
        run: |
          go mod tidy

      - name: Build Windows Portable Binary
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          New-Item -ItemType Directory -Force -Path "dist"
          go build -v -ldflags="-s -w" -o dist/RouterPilot.exe ./cmd/routerpilot

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouterPilot-Windows-x64
          path: dist/RouterPilot.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RouterPilot.exe
          name: RouterPilot Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 RouterPilot Release ${{ github.ref_name }}
            
            فایل اجرایی مستقل و پرتابل ویندوز برای RouterPilot.
            
            ### ویژگی‌های نسخه ۱.۱:
            - **طراحی مدرن Glassmorphism:** داشبورد ۶ کارته KPI، نمودار ترافیک ۲۴ ساعته و جدول داینامیک اینترنت‌ها
            - **پشتیبانی کامل از هر اپراتور:** حذف وابستگی به نام‌های خاص و امکان برچسب‌گذاری دلخواه برای خطوط اینترنت
            - **هوش مصنوعی Prompt-to-Plan:** تبدیل هر درخواست شبکه (وایرگارد، فوروارد پورت، کنترل سرعت) به پلن تراکنشی میکروتیک
            - **فاز صفر روتر مرجع:** بسته کامل استانداردهای روتر مرجع و آزمون‌گر خودکار
